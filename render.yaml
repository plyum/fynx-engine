# Plan de déploiement Render (facultatif : le service peut aussi être créé à la main). Les secrets ne sont JAMAIS dans ce fichier.
# À la création, Render demande la valeur des deux secrets indispensables (sync: false).
# SOLANA_RPC_URL et JUPITER_API_KEY (facultatives) s'ajoutent ensuite dans Render > Environment.
# plan 0.5c-512mb = l'instance à 7 $/mois (0,5 CPU, 512 Mo), appelée « Starter » avant. Ne jamais mettre « free » : il s'endort.
services:
  - type: web
    name: fynx-engine
    runtime: node
    plan: 0.5c-512mb
    region: oregon
    buildCommand: npm install --omit=dev
    # « exec node » et non « npm start » : npm ne transmet pas SIGTERM à node, donc le verrou du moteur n'était jamais rendu
    # à chaque mise à jour (surveillance coupée ~2 min). Avec exec, node reçoit lui-même le signal et rend le verrou.
    startCommand: exec node src/server.ts
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: SUPABASE_URL
        value: https://gircvhlzgyajpvipsykn.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
