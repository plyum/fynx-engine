# Plan de déploiement Render (facultatif : le service peut aussi être créé à la main). Les secrets ne sont JAMAIS dans ce fichier.
# À la création, Render demande la valeur des deux secrets indispensables (sync: false).
# SOLANA_RPC_URL et JUPITER_API_KEY (facultatives) s'ajoutent ensuite dans Render > Environment.
services:
  - type: web
    name: fynx-engine
    runtime: node
    plan: starter
    region: oregon
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_VERSION
        value: "22.23.4"
      - key: SUPABASE_URL
        value: https://gircvhlzgyajpvipsykn.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: WALLET_ENCRYPTION_KEY
        sync: false
